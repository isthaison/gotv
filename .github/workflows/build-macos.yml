name: Build macOS Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    # Needed by the Release Asset step (softprops/action-gh-release)
    # to attach the macOS zip on tags.
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install glib pkg-config

      - name: Build and test core engine
        # Same suites as Windows (engine + support + algorithm):
        # the IBus/GTK tests stay Linux-only.
        run: |
          mkdir -p build/macos
          CORE_CFLAGS="$(pkg-config --cflags glib-2.0 gio-2.0) -Iengine"
          CORE_LIBS="$(pkg-config --libs glib-2.0 gio-2.0) -lm"
          clang -O2 -g -std=gnu11 -Wall -Wextra -Wno-unused-parameter \
            $CORE_CFLAGS tests/test_engine.c engine/*.c $CORE_LIBS \
            -o build/macos/test-engine
          clang -O2 -g -std=gnu11 -Wall -Wextra -Wno-unused-parameter \
            $CORE_CFLAGS tests/test_support.c engine/*.c $CORE_LIBS \
            -o build/macos/test-support
          GTV_DATA_DIR="$PWD/data" ./build/macos/test-engine
          GTV_DATA_DIR="$PWD/data" ./build/macos/test-support

      - name: Build GoTV.app bundle
        run: |
          APP=build/macos/GoTV.app/Contents
          mkdir -p "$APP/MacOS" "$APP/Resources/data"
          CORE_CFLAGS="$(pkg-config --cflags glib-2.0 gio-2.0) -Iengine"
          CORE_LIBS="$(pkg-config --libs glib-2.0 gio-2.0) -lm"
          # Manual-retain sources, no Blocks, no ARC: plain clang must pass.
          clang -O2 -g -Wall \
            $CORE_CFLAGS \
            -framework Cocoa -framework InputMethodKit \
            engine/*.c macos/*.m $CORE_LIBS \
            -o "$APP/MacOS/GoTV"
          cp macos/Info.plist "$APP/Info.plist"
          printf 'APPL????' > "$APP/PkgInfo"
          cp data/macros.txt data/emojis.txt data/config data/dict-*.txt \
            data/learned-corrections.txt \
            data/learned-words.txt "$APP/Resources/data/"
          plutil -lint "$APP/Info.plist"
          file "$APP/MacOS/GoTV"
          find build/macos/GoTV.app -maxdepth 4 | sort

      - name: Compute version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="$(cat VERSION 2>/dev/null || echo 0.8.0)"
          fi
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          echo "version: $VER"

      - name: Package installer .dmg and .pkg
        run: |
          # 1. Package .pkg installer via Apple native pkgbuild
          mkdir -p "build/macos/pkg_root/Library/Input Methods"
          cp -R build/macos/GoTV.app "build/macos/pkg_root/Library/Input Methods/"
          pkgbuild --root build/macos/pkg_root \
                   --identifier "org.freedesktop.IBus.GoTV" \
                   --version "${APP_VERSION}" \
                   --install-location "/" \
                   "build/macos/gotv-${APP_VERSION}-macos.pkg"

          # 2. Package .dmg installer via Apple native hdiutil
          mkdir -p build/macos/dmg_root
          cp -R build/macos/GoTV.app build/macos/dmg_root/
          ln -s "/Library/Input Methods" "build/macos/dmg_root/Input Methods"
          ln -s /Applications build/macos/dmg_root/Applications
          hdiutil create -volname "GoTV" \
                         -srcfolder build/macos/dmg_root \
                         -ov -format UDZO \
                         "build/macos/gotv-${APP_VERSION}-macos.dmg"

          ls -la build/macos/gotv-*-macos.*
          for package in build/macos/gotv-*-macos.*; do
            cp "$package" "${package/gotv-/gotiengviet-}"
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gotv-macos-installers
          path: |
            build/macos/gotv-*-macos.dmg
            build/macos/gotv-*-macos.pkg

      - name: Release Asset (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/macos/gotv-*-macos.dmg
            build/macos/gotv-*-macos.pkg
            build/macos/gotiengviet-*-macos.dmg
            build/macos/gotiengviet-*-macos.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
