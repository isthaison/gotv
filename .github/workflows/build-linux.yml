name: Build Linux Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential pkg-config libglib2.0-dev \
            libibus-1.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-bin

      - name: Build All
        run: make build

      - name: Run Test Suite
        run: make test

      - name: Get Version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER=$(cat VERSION | tr -d '\r\n ')
          echo "APP_VERSION=${VER}-1" >> "$GITHUB_ENV"
          echo "deb version: ${VER}-1"

      - name: Package .deb
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          make package VERSION="$APP_VERSION"
          ls -la gotv_*.deb

      - name: Upload Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: gotv-deb
          path: gotv_*.deb

      - name: Release Asset (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gotv_*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
