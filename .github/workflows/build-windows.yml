name: Build Windows Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pkg-config

      - name: Run Test Suite
        shell: msys2 {0}
        run: |
          make -f Makefile.win test

      - name: Build gotv.exe
        shell: msys2 {0}
        run: |
          make -f Makefile.win

      - name: Compute version
        shell: msys2 {0}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="$(sed -n 's/^#define GTV_VERSION "\(.*\)"/\1/p' windows/version.h)"
            [ -n "$VER" ] || VER="0.9.1"
          fi
          VERNUM="$(echo "$VER" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/').0"
          case "$VERNUM" in
            [0-9]*.[0-9]*.[0-9]*.[0-9]*) ;;
            *) VERNUM="0.0.0.0" ;;
          esac
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          echo "APP_VERNUM=$VERNUM" >> "$GITHUB_ENV"
          echo "version: $VER ($VERNUM)"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y

      - name: Stage installer tree
        shell: msys2 {0}
        run: |
          make -f Makefile.win staging

      - name: Build versioned installer
        shell: msys2 {0}
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" /Q "/DAppVersion=$APP_VERSION" "/DAppVerNum=$APP_VERNUM" "/DSourceDir=..\\release-pkg" windows/installer.iss
          ls -la gotv-*-x64-setup.exe

      # ── Code signing (self-signed cert + osslsigncode) ────────────
      - name: Sign installer with self-signed cert
        if: env.WIN_CERT_PFX_B64 != ''
        shell: msys2 {0}
        env:
          WIN_CERT_PFX_B64: ${{ secrets.WIN_CERT_PFX_B64 }}
        run: |
          pacman -S --noconfirm osslsigncode 2>/dev/null || true
          SETUP=$(ls gotv-*-x64-setup.exe 2>/dev/null | head -1)
          if [ -z "$SETUP" ]; then echo "No setup exe found"; exit 1; fi
          echo "$WIN_CERT_PFX_B64" | base64 -d > /tmp/cert.pfx
          osslsigncode sign -pkcs12 /tmp/cert.pfx -pass gtv2026 \
            -n "GoTV" -i "https://github.com/isthaison/gotv" \
            -in "$SETUP" -out "${SETUP%.exe}-signed.exe" && \
          mv "${SETUP%.exe}-signed.exe" "$SETUP"
          echo "Signed: $SETUP"
          rm -f /tmp/cert.pfx

      # ── Upload artifact ───────────────────────────────────────────
      - name: Keep installer alias for pre-GoTV updaters
        shell: msys2 {0}
        run: |
          for setup in gotv-*-x64-setup.exe; do
            cp "$setup" "${setup/gotv-/gotiengviet-}"
          done

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: gotv-windows-setup
          path: gotv-*-x64-setup.exe
          if-no-files-found: error

      # ── Release (on tag) ──────────────────────────────────────────
      # data/dict-vi.txt ships as a release asset too: the app refreshes its
      # offline word list from it (same channel as the installer, throttled).
      - name: Release Asset (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gotv-*-x64-setup.exe
            gotiengviet-*-x64-setup.exe
            data/dict-*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
