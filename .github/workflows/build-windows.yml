name: Build Windows Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      WIN_CERT_PFX_B64: ${{ secrets.WIN_CERT_PFX_B64 }}
      STORE_SIGNING_CERT_PFX_B64: ${{ secrets.STORE_SIGNING_CERT_PFX_B64 }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          cache: true
          install: >-
            git
            make
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pkg-config
            mingw-w64-i686-gcc
            mingw-w64-i686-glib2
            mingw-w64-i686-pkg-config

      - name: Run Test Suite
        shell: msys2 {0}
        run: |
          make -j$(nproc) -f Makefile.win test

      - name: Compute version
        shell: msys2 {0}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="$(sed -n 's/^#define GTV_VERSION "\(.*\)"/\1/p' windows/version.h)"
            [ -n "$VER" ] || VER="0.9.15"
          fi
          VERNUM="$(echo "$VER" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/').0"
          case "$VERNUM" in
            [0-9]*.[0-9]*.[0-9]*.[0-9]*) ;;
            *) VERNUM="0.0.0.0" ;;
          esac
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          echo "APP_VERNUM=$VERNUM" >> "$GITHUB_ENV"
          echo "version: $VER ($VERNUM)"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Stage installer tree
        shell: msys2 {0}
        run: |
          make -j$(nproc) -f Makefile.win staging

      - name: Stage Store installer tree
        if: vars.STORE_SIGNING_ENABLED == 'true'
        shell: msys2 {0}
        run: |
          make -j$(nproc) -f Makefile.win store-staging

      # ── Standard Release: Unsigned build if no cert configured ─────
      - name: Build unsigned versioned installer
        if: env.WIN_CERT_PFX_B64 == ''
        shell: msys2 {0}
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" /Q "/DAppVersion=$APP_VERSION" "/DAppVerNum=$APP_VERNUM" "/DSourceDir=..\\release-pkg" windows/installer.iss
          ls -la gotv-*-x64-setup.exe

      # ── Standard Release: Full Authenticode Signing (payload + uninstaller + setup) ──
      - name: Sign and build versioned installer
        if: env.WIN_CERT_PFX_B64 != ''
        shell: powershell
        env:
          WIN_CERT_PFX_B64: ${{ secrets.WIN_CERT_PFX_B64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD || 'gtv2026' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $certPath = Join-Path $env:RUNNER_TEMP 'gotv-release-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WIN_CERT_PFX_B64))
            # Sign all PE files in payload
            .\tools\sign-windows-binaries.ps1 -Path release-pkg -CertificatePath $certPath -Password $env:WIN_CERT_PASSWORD -AllowUntrustedRoot
            $env:STORE_SIGNING_CERT_PATH = $certPath
            $env:STORE_SIGNING_CERT_PASSWORD = $env:WIN_CERT_PASSWORD
            $env:GTV_ALLOW_UNTRUSTED_ROOT = '1'
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
            $signScript = Join-Path $PWD 'tools\sign-inno-output.ps1'
            $signCommand = 'powershell.exe -NoProfile -File $q' + $signScript + '$q $f'
            & $iscc /Q "/Sstore=$signCommand" "/DAppVersion=$env:APP_VERSION" "/DAppVerNum=$env:APP_VERNUM" '/DSourceDir=..\release-pkg' /DSignInstaller windows\installer.iss
            if ($LASTEXITCODE -ne 0) { throw "Signed installer compilation failed with exit code $LASTEXITCODE" }
            # Sign and verify outer installer
            .\tools\sign-windows-binaries.ps1 -Path "gotv-$env:APP_VERSION-x64-setup.exe" -CertificatePath $certPath -Password $env:WIN_CERT_PASSWORD -AllowUntrustedRoot
          } finally {
            Remove-Item -LiteralPath $certPath -Force -ErrorAction SilentlyContinue
            Remove-Item Env:\STORE_SIGNING_CERT_PATH -ErrorAction SilentlyContinue
            Remove-Item Env:\STORE_SIGNING_CERT_PASSWORD -ErrorAction SilentlyContinue
            Remove-Item Env:\GTV_ALLOW_UNTRUSTED_ROOT -ErrorAction SilentlyContinue
          }

      # ── Store Package: Build & Sign with Trusted Root PFX ───────────
      - name: Sign and verify Store package (PFX)
        if: github.event_name != 'pull_request' && vars.STORE_SIGNING_ENABLED == 'true' && env.STORE_SIGNING_CERT_PFX_B64 != ''
        shell: powershell
        env:
          STORE_SIGNING_CERT_PFX_B64: ${{ secrets.STORE_SIGNING_CERT_PFX_B64 }}
          STORE_SIGNING_CERT_PASSWORD: ${{ secrets.STORE_SIGNING_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:STORE_SIGNING_CERT_PFX_B64) -or
              [string]::IsNullOrWhiteSpace($env:STORE_SIGNING_CERT_PASSWORD)) {
            throw 'Store signing is enabled but the signing certificate secrets are not configured.'
          }
          $certPath = Join-Path $env:RUNNER_TEMP 'gotv-store-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:STORE_SIGNING_CERT_PFX_B64))
            # Sign all PE files in Store payload (enforcing Microsoft Trusted Root)
            .\tools\sign-windows-binaries.ps1 -Path release-pkg-store -CertificatePath $certPath -Password $env:STORE_SIGNING_CERT_PASSWORD
            $env:STORE_SIGNING_CERT_PATH = $certPath
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
            $signScript = Join-Path $PWD 'tools\sign-inno-output.ps1'
            $signCommand = 'powershell.exe -NoProfile -File $q' + $signScript + '$q $f'
            & $iscc /Q "/Sstore=$signCommand" "/DAppVersion=$env:APP_VERSION" "/DAppVerNum=$env:APP_VERNUM" '/DSourceDir=..\release-pkg-store' /DStoreSubmission /DStoreSigning windows\installer.iss
            if ($LASTEXITCODE -ne 0) { throw "Signed Store installer compile failed with exit code $LASTEXITCODE" }
            # Verify outer Store installer (enforcing Microsoft Trusted Root)
            .\tools\sign-windows-binaries.ps1 -Path "gotv-$env:APP_VERSION-x64-store-setup.exe" -CertificatePath $certPath -Password $env:STORE_SIGNING_CERT_PASSWORD -VerifyOnly
          } finally {
            Remove-Item -LiteralPath $certPath -Force -ErrorAction SilentlyContinue
            Remove-Item Env:\STORE_SIGNING_CERT_PATH -ErrorAction SilentlyContinue
          }

      # ── Store Package: Build and submit via SignPath Foundation (when token configured) ──
      - name: Build Store installer for SignPath
        if: github.event_name != 'pull_request' && vars.STORE_SIGNING_ENABLED == 'true' && env.STORE_SIGNING_CERT_PFX_B64 == '' && env.SIGNPATH_API_TOKEN != ''
        shell: powershell
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc /Q "/DAppVersion=$env:APP_VERSION" "/DAppVerNum=$env:APP_VERNUM" '/DSourceDir=..\release-pkg-store' /DStoreSubmission windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Upload unsigned Store installer for SignPath
        id: upload-store-unsigned
        if: github.event_name != 'pull_request' && vars.STORE_SIGNING_ENABLED == 'true' && env.STORE_SIGNING_CERT_PFX_B64 == '' && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: gotv-windows-store-unsigned
          path: gotv-*-x64-store-setup.exe

      - name: Submit to SignPath Foundation
        if: github.event_name != 'pull_request' && vars.STORE_SIGNING_ENABLED == 'true' && env.STORE_SIGNING_CERT_PFX_B64 == '' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID || secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'gotv' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-store-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: './signed-store-output'

      - name: Copy SignPath signed artifact
        if: github.event_name != 'pull_request' && vars.STORE_SIGNING_ENABLED == 'true' && env.STORE_SIGNING_CERT_PFX_B64 == '' && env.SIGNPATH_API_TOKEN != ''
        shell: powershell
        run: |
          Copy-Item -Path .\signed-store-output\*.exe -Destination .\ -Force
          Get-Item gotv-*-x64-store-setup.exe | Select-Object Name,Length

      # ── Artifact Uploads ───────────────────────────────────────────
      - name: Upload Store installer
        if: github.event_name != 'pull_request' && vars.STORE_SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gotv-windows-store-installer
          path: gotv-*-x64-store-setup.exe
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: gotv-windows-setup
          path: gotv-*-x64-setup.exe
          if-no-files-found: error

      # ── Release (on Tag) ──────────────────────────────────────────
      - name: Release Asset (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gotv-*-x64-setup.exe
            data/dict-*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Store Release Asset (on Tag)
        if: startsWith(github.ref, 'refs/tags/v') && vars.STORE_SIGNING_ENABLED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: gotv-*-x64-store-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── WinGet Community Submission ──────────────────────────────
      - name: Submit to WinGet Community Repository
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN || secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_TOKEN)) {
            Write-Warning "WINGET_TOKEN is not configured in repository secrets. Skipping automatic WinGet submission."
            exit 0
          }
          Write-Host "Downloading latest wingetcreate..."
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile "wingetcreate.exe"
          $downloadUrl = "https://github.com/isthaison/gotv/releases/download/v$($env:APP_VERSION)/gotv-$($env:APP_VERSION)-x64-setup.exe"
          Write-Host "Submitting GoTV $env:APP_VERSION to winget-pkgs with URL: $downloadUrl"
          .\wingetcreate.exe update isthaison.GoTV `
            --version $env:APP_VERSION `
            --urls "$downloadUrl|x64" `
            --token $env:WINGET_TOKEN `
            --submit
