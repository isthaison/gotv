ShortDescription: Free, open-source Vietnamese input method (Telex & VNI) using native Windows TSF.
Description: |-
  GoTV is a lightweight, open-source Vietnamese keyboard input method engine for Windows 10/11, Linux (IBus), and macOS (InputMethodKit).
  On Windows, GoTV is built as a pure native Text Services Framework (TSF) Text Service, eliminating the invasive global keyboard hooks used by legacy tools.
  Features include offline dictionary suggestions, text macros, emojis, and full compatibility with code editors, terminals, and modern browsers without red underline glitches.
